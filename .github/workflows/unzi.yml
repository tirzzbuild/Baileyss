name: Unzip Baileys to Repository Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -eu

          ZIP_FILE="Tirzz.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Tirzz.zip tidak ditemukan di root repository."
            exit 1
          fi

          mkdir -p temp_extract
          unzip -o "$ZIP_FILE" -d temp_extract

          SOURCE="temp_extract/Baileys-main"

          if [ -d "$SOURCE" ]; then
            cp -a "$SOURCE"/. .
          else
            echo "ERROR: Folder Baileys-main tidak ditemukan di dalam ZIP."
            find temp_extract -maxdepth 3 -type f
            exit 1
          fi

          rm -rf temp_extract

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Baileys files to repository root" || echo "No changes to commit"
          git push
